<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification de sécurité - Noël Anti-IA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="captcha-wrapper">
        <div class="captcha-card" id="captchaCard">
            <div class="captcha-header">
                <span class="captcha-logo">Noël</span>
                <span class="captcha-title" id="captchaTitle">Vérification de sécurité</span>
            </div>
            <div class="captcha-body">
                <div class="captcha-subtitle" id="captchaSubtitle"></div>
                <div id="captchaContent"></div>
            </div>
            <div class="captcha-footer">
                <div class="captcha-progress" id="captchaProgress">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span class="progress-text" id="progressText"></span>
                </div>
                <button class="captcha-verify-btn" id="verifyBtn" disabled>VÉRIFIER</button>
                <div class="captcha-recaptcha-branding">
                    <span>Ce site est protégé par Noël Anti-IA</span>
                </div>
            </div>
        </div>
        <div class="final-screen" id="finalScreen">
            <div class="final-card">
                <div class="final-icon">🎄</div>
                <h1 class="final-title">Vérification réussie !</h1>
                <p class="final-message">L'année dernière, beaucoup de gens ont utilisé l'IA pour répondre aux énigmes. J'ai donc mis un anti-IA !</p>
                <div class="riddle-placeholder">
                    <h2>🎅 Énigme de Noël 🎅</h2>
                    <p class="riddle-text">[L'énigme secrète apparaîtra ici]</p>
                    <textarea class="riddle-answer" placeholder="Votre réponse..." rows="3"></textarea>
                    <button class="riddle-submit-btn" id="riddleSubmitBtn">Soumettre</button>
                    <div class="riddle-feedback" id="riddleFeedback"></div>
                </div>
            </div>
        </div>
    </div>
    <a href="https://neal.fun" class="inspiration-link" target="_blank" rel="noopener noreferrer">inspiré par neal.fun</a>
    <script type="module" src="js/engine.js?v=2"></script>
</body>
</html>

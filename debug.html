<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Checkbox</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', 'Arial', sans-serif; padding: 20px; }
        .captcha-checkbox-container {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border: 2px solid #dadce0;
            border-radius: 4px;
            cursor: pointer;
            transition: border-color 0.2s ease;
            margin: 20px 0;
        }
        .captcha-checkbox-container:hover {
            border-color: #1a73e8;
        }
        .captcha-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #c1c1c1;
            border-radius: 4px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .captcha-checkbox.checked {
            background: #1a73e8;
            border-color: #1a73e8;
        }
        .captcha-checkbox.checked::after {
            content: "\2714";
            color: #fff;
            font-size: 16px;
            font-weight: bold;
        }
        .captcha-checkbox-label {
            font-size: 14px;
            color: #202124;
            user-select: none;
        }
        button {
            padding: 12px 24px;
            background: #fff;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        button:not(:disabled) {
            background: #1a73e8;
            color: white;
        }
        #log {
            margin-top: 20px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>Debug Checkbox Test</h1>
    <div id="testContainer"></div>
    <br>
    <button id="testBtn" disabled>TEST BUTTON</button>
    <div id="log"></div>

    <script>
        function log(msg) {
            const logEl = document.getElementById('log');
            logEl.textContent += msg + '\n';
            console.log(msg);
        }

        log('DOM loaded');
        
        const container = document.getElementById('testContainer');
        const btn = document.getElementById('testBtn');
        
        log('Creating checkbox...');
        
        const checkboxContainer = document.createElement('div');
        checkboxContainer.className = 'captcha-checkbox-container';
        
        const checkbox = document.createElement('div');
        checkbox.className = 'captcha-checkbox';
        
        const label = document.createElement('span');
        label.className = 'captcha-checkbox-label';
        label.textContent = 'Vérifiez que vous êtes un humain - Mirion Captch';
        
        checkboxContainer.appendChild(checkbox);
        checkboxContainer.appendChild(label);
        container.appendChild(checkboxContainer);
        
        log('Checkbox created');
        
        checkboxContainer.addEventListener('click', () => {
            log('Checkbox clicked!');
            if (!checkbox.classList.contains('checked')) {
                checkbox.classList.add('checked');
                btn.disabled = false;
                log('Button enabled');
            }
        });
        
        log('Event listener added');
        log('Test complete');
    </script>
</body>
</html>

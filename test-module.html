<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Module</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Roboto, Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        #log { padding: 10px; background: #fff; font-family: monospace; font-size: 12px; border: 1px solid #ddd; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>ES Module Test</h1>
    <div id="testContainer"></div>
    <div id="log"></div>

    <script type="module">
        const log = document.getElementById('log');
        function addLog(msg) { log.textContent += msg + '\n'; console.log(msg); }
        
        try {
            addLog('Module started');
            
            // Try to import a level
            const level1 = await import('./js/levels/level1.js');
            addLog('Level1 imported: ' + JSON.stringify(level1));
            
            // Create checkbox
            const container = document.getElementById('testContainer');
            const checkboxContainer = document.createElement('div');
            checkboxContainer.style.cssText = 'padding: 16px; border: 2px solid #dadce0; margin: 10px 0; cursor: pointer;';
            checkboxContainer.textContent = 'Checkbox test';
            container.appendChild(checkboxContainer);
            addLog('Checkbox created');
            
            checkboxContainer.addEventListener('click', () => {
                addLog('Checkbox clicked!');
                checkboxContainer.style.background = '#e8f0fe';
            });
            
            addLog('Setup complete');
        } catch (e) {
            addLog('Error: ' + e.message);
            addLog('Stack: ' + e.stack);
        }
    </script>
</body>
</html>

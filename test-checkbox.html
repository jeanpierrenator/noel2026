<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Simple</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Roboto, Arial, sans-serif; background: linear-gradient(135deg, #1a472a 0%, #2d5a3f 30%, #c0392b 70%, #e74c3c 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .captcha-wrapper { width: 100%; max-width: 450px; }
        .captcha-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15); overflow: hidden; }
        .captcha-header { background: #1a73e8; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
        .captcha-logo { font-size: 20px; font-weight: 700; }
        .captcha-title { font-size: 15px; flex: 1; }
        .captcha-body { padding: 20px 24px; }
        #captchaContent { min-height: 100px; }
        .captcha-checkbox-container { display: flex; align-items: center; gap: 12px; padding: 16px; border: 2px solid #dadce0; border-radius: 4px; cursor: pointer; }
        .captcha-checkbox-container:hover { border-color: #1a73e8; }
        .captcha-checkbox { width: 24px; height: 24px; border: 2px solid #c1c1c1; border-radius: 4px; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .captcha-checkbox.checked { background: #1a73e8; border-color: #1a73e8; }
        .captcha-checkbox.checked::after { content: "\2714"; color: #fff; font-size: 16px; font-weight: bold; }
        .captcha-checkbox-label { font-size: 14px; color: #202124; user-select: none; }
        .captcha-footer { padding: 0 24px 20px; }
        .captcha-verify-btn { width: 100%; padding: 12px 16px; background: #fff; border: 1px solid #dadce0; border-radius: 4px; font-size: 14px; cursor: pointer; }
        .captcha-verify-btn:not(:disabled) { background: #1a73e8; color: #fff; }
        #log { margin-top: 20px; padding: 10px; background: #f5f5f5; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <div>
        <div class="captcha-card">
            <div class="captcha-header">
                <span class="captcha-logo">Test</span>
                <span class="captcha-title" id="captchaTitle">Test</span>
            </div>
            <div class="captcha-body">
                <div id="captchaContent"></div>
            </div>
            <div class="captcha-footer">
                <button class="captcha-verify-btn" id="verifyBtn" disabled>TEST</button>
            </div>
        </div>
        <div id="log"></div>
    </div>

    <script>
        const log = document.getElementById('log');
        function addLog(msg) { log.textContent += msg + '\n'; console.log(msg); }
        
        addLog('DOM ready');
        
        const content = document.getElementById('captchaContent');
        const btn = document.getElementById('verifyBtn');
        const title = document.getElementById('captchaTitle');
        
        addLog('Elements found: ' + !!content + ' ' + !!btn + ' ' + !!title);
        
        title.textContent = 'Test Title';
        btn.disabled = true;
        
        const checkboxContainer = document.createElement('div');
        checkboxContainer.className = 'captcha-checkbox-container';
        
        const checkbox = document.createElement('div');
        checkbox.className = 'captcha-checkbox';
        
        const label = document.createElement('span');
        label.className = 'captcha-checkbox-label';
        label.textContent = 'Vérifiez que vous êtes un humain';
        
        checkboxContainer.appendChild(checkbox);
        checkboxContainer.appendChild(label);
        content.appendChild(checkboxContainer);
        
        addLog('Checkbox created and appended');
        
        checkboxContainer.addEventListener('click', () => {
            addLog('Checkbox clicked!');
            if (!checkbox.classList.contains('checked')) {
                checkbox.classList.add('checked');
                btn.disabled = false;
                addLog('Button enabled');
            }
        });
        
        btn.addEventListener('click', () => {
            addLog('Button clicked!');
        });
        
        addLog('Setup complete');
    </script>
</body>
</html>
